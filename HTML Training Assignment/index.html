<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container-fluid main">
        <div class="main-flex">
            <div class="common first">
                <img class="hero" src="./image/hero-image.png" alt="This is talent">
            </div>
            <div class="common second">
                <div class="flex">
                    <img class="logo-img" src="./image/header-logo.svg" alt="Company Header">
                    <div class="tagline">
                        <p>We are <span class="red">experts</span> in business,<br/>
                        marketing,growth, & sales.</p>
                    </div>
                    <div class="login-text">
                        <p>Login into your account</p>
                    </div>
                    <form action="" class="input-fields">
                        <input class="input" type="text" name="username" placeholder="Username">
                        <input class="input" type="text" name="password" placeholder="Password">
                        <div class="buttons">
                            <a class="login-btn" href="./dashboard.html"><input type="button" class="btn submit-btn" value="Login"></a>
                            <a href="#" class="forgot-btn">Forgot Password?</a>
                        </div>
                    </form>
                    <p class="register">Are you a new Member? <a href="#" class="register-btn">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
