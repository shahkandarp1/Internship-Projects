<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallo Doc - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/admin-provider/style.css">
    <script src="../../js/admin-provider/script.js"></script>
</head>

<body>
    <img src="../../images/7768657_3763028.jpg" alt="" class="bg-image">
    <div class="main-container">
        <div class="left half-container">
            <img class="left-img" src="../../images/11116016_415.jpg" alt="">
        </div>
        <div class="right half-container">
            <span class="top-right-moon">
                <div class="moon">
                    <img src="../../images/moon.svg" alt="" class="moon-img">
                </div>
            </span>
            <div class="right-flex-container">
                <div class="logo">
                    <img src="../../images/logo1.png" alt="" class="logo-img">
                </div>
                <form action="" class="login-content">
                    <span class="login-text">Login To Your Account</span>
                    <div class="form-floating mb-3 inp">
                        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                        <label for="floatingInput" class="form-label">Username</label>
                        <img src="../../images/user.png" alt="" class="inp-side-picture">
                    </div>
                    <div class="form-floating inp">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword" class="form-label">Password</label>
                        <a href="#" onclick="changeVisibility()" style="cursor: pointer;"><img id="open-eye" src="../../images/view.png" alt="" class="inp-side-picture eye"></a>
                        <a href="#" onclick="changeVisibility()" style="cursor: pointer;"><img id="closed-eye" src="../../images/hide.png" alt="" class="inp-side-picture eye hidden"></a>
                    </div>

                    <a class="btn btn-info custom-submit-btn" href="#">Log In</a>
                    <a href="./forgot-password.html" class="forgot-password">Forgot Password?</a>
                </form>
            </div>
            <div class="bottom-part-flex"><a href="#" class="bottom-part-a right-a">Terms of Conditions</a> | <a href="#" class="bottom-part-a left-a">Privacy Policy</a></div>
        </div>
    </div>
</body>

</html>
