<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../css/patient/patient-dashboard.css">
    <script src="../../js/patient/patient-dashboard.js"></script>
</head>

<body>
    <!-- Navbar -->
    <div class="navbar">
        <img src="../../images/logo1.png" alt="" class="logo" />
        <div class="right-side-elements">
            <span class="welcome-text">Welcome <span class="name-text">Tests Testing</span></span>
            <button class="logout" onclick="logout()">
                <span class="logout-text">Logout</span>
            </button>
            <button class="logout-mob" onclick="logout()">
                <img id="logout" src="../../images/box-arrow-right.svg" alt="" class="logout-img" />
            </button>
            <button class="moon" onclick="changeMode()">
                <img id="moon" src="../../images/moon.svg" alt="" class="moon-img" />
                <img id="sun" src="../../images/sun.svg" alt="" class="moon-img hidden" />
            </button>
        </div>
    </div>
</body>

</html>
